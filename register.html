
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Registro - 2veinte</title>
</head>
<body>

  <main class="register-container">
    <h2>Crear cuenta</h2>

    <form id="register-form">

      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        autocomplete="given-name"
        required
      />

      <label for="apellido">Apellido</label>
      <input
        type="text"
        id="apellido"
        autocomplete="family-name"
        required
      />

      <label for="cargo">Cargo</label>
      <input
        type="text"
        id="cargo"
        value="Técnico"
        disabled
      />

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        autocomplete="email"
        required
      />

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        autocomplete="new-password"
        minlength="8"
        required
      />

      <label for="confirm-password">
        Confirmar contraseña
      </label>
      <input
        type="password"
        id="confirm-password"
        autocomplete="new-password"
        required
      />

      <p
        id="error-message"
        role="alert"
        hidden
      ></p>

      <p
        id="success-message"
        role="status"
        hidden
      ></p>

      <button type="submit" id="submit-btn">
        Crear cuenta
      </button>

    </form>

    <p>
      ¿Ya tienes cuenta?
      <a href="/login.html">Iniciar sesión</a>
    </p>
  </main>

  <script
    type="module"
    src="/src/modules/auth/register.ts"
  ></script>

</body>
</html>
